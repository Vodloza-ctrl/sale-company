<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Sale Company</title><link rel="stylesheet" href="assets/css/styles.css"><style>.login-logo{height:34px;width:auto;margin:0 auto 28px;display:block}</style></head><body><main class="wrap" style="max-width:480px;padding:60px 0"><div class="card"><img class="login-logo" src="https://sale.co.zw/branding/logos/sale-logo-primary.svg" alt="Sale Company"><p class="eyebrow">Tenant Login</p><h1>Access your dashboard</h1><form class="form" onsubmit="event.preventDefault(); location.href='dashboard.html'"><input class="input" type="email" placeholder="Email address" required><input class="input" type="password" placeholder="Password" required><button class="btn gold">Login</button></form><p class="muted">Supabase Auth-ready. Frontend uses anon key only; Worker verifies JWT and tenant role.</p></div></main>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Mobile nav
  const nav = document.querySelector('.nav-links,.main-nav,nav ul');
  const header = document.querySelector('header') || document.body;
  if(nav && !document.querySelector('.mobile-menu-btn')){
    const btn = document.createElement('button');
    btn.className = 'mobile-menu-btn';
    btn.innerHTML = '☰';
    btn.style.cssText='position:fixed;top:14px;right:14px;z-index:9999;padding:10px 14px;border:none;border-radius:10px;background:#0F5B47;color:#fff;font-size:20px;';
    btn.onclick = ()=> nav.classList.toggle('mobile-open');
    header.appendChild(btn);
  }

  // Scroll animations
  const els = document.querySelectorAll('.card,.feature,.section,section,.product-card');
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.style.opacity='1';
        e.target.style.transform='translateY(0)';
      }
    });
  }, {threshold:0.08});

  els.forEach(el=>{
    el.style.opacity='0';
    el.style.transform='translateY(18px)';
    el.style.transition='all .45s ease';
    obs.observe(el);
  });
});
</script>

</body></html>
