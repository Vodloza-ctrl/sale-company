<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Sale Company</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><div class="dash"><aside class="side"><div class="brand">Sale Admin</div><a class="active">Platform</a><a>Tenants</a><a>Payments</a><a>Risk</a><a>Support</a><a>Audit Logs</a></aside><main class="main"><p class="eyebrow">Platform owner</p><h1>System health</h1><div class="metric-grid"><div class="metric"><span class="muted">Tenants</span><br><strong>12</strong></div><div class="metric"><span class="muted">Revenue</span><br><strong>$420</strong></div><div class="metric"><span class="muted">Failed payments</span><br><strong>2</strong></div><div class="metric"><span class="muted">Risk flags</span><br><strong>1</strong></div></div><p class="notice">Admin panel must be protected separately, with strong auth, audit logs, rate limiting and payout-change review.</p></main></div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Mobile nav
  const nav = document.querySelector('.nav-links,.main-nav,nav ul');
  const header = document.querySelector('header') || document.body;
  if(nav && !document.querySelector('.mobile-menu-btn')){
    const btn = document.createElement('button');
    btn.className = 'mobile-menu-btn';
    btn.innerHTML = '☰';
    btn.style.cssText='position:fixed;top:14px;right:14px;z-index:9999;padding:10px 14px;border:none;border-radius:10px;background:#0F5B47;color:#fff;font-size:20px;';
    btn.onclick = ()=> nav.classList.toggle('mobile-open');
    header.appendChild(btn);
  }

  // Scroll animations
  const els = document.querySelectorAll('.card,.feature,.section,section,.product-card');
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.style.opacity='1';
        e.target.style.transform='translateY(0)';
      }
    });
  }, {threshold:0.08});

  els.forEach(el=>{
    el.style.opacity='0';
    el.style.transform='translateY(18px)';
    el.style.transition='all .45s ease';
    obs.observe(el);
  });
});
</script>

</body></html>
